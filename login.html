<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAV ICON -->
    <link rel="icon" type="image/png" href="./assets/img/logo-png-sem-o-nome.png">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./login.css">

    <meta name="description" content="Acesse sua conta na Living Screen e tenha acesso a soluções digitais, suporte técnico e conteúdo exclusivo da nossa plataforma.">
    <meta name="keywords" content="login Living Screen, acessar conta, suporte técnico, plataforma digital, tecnologia">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Living Screen">
    <meta name="theme-color" content="#0d1117">

    <meta property="og:title" content="Login | Living Screen">
    <meta property="og:description" content="Entre na sua conta da Living Screen e aproveite nossos serviços e soluções digitais.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/img/livingScreenLogoPng.png">

    <title>Login | Living Screen | Acesse Sua Conta</title>

    <!-- pre-loader -->
    <link rel="stylesheet" href="./assets/css/preLoader.css">

</head>

<body>

    <!-- PRE-LOADER -->

    <div id="preloader">

        <div class="loader-bolhas">
            <div class="bubble-1"></div>
            <div class="bubble-2"></div>
        </div>

        <p>Carregando...</p>

    </div>

    <div id="liquid-effect">
        <canvas id="liquid-canvas"></canvas>
    </div>


    <!-- NAVBAR-->
    <header class="login-header">

        <!-- LOGO -->
        <a href="./index.html" class="login-logo">
            <img src="./assets/img/logo-png-sem-o-nome.png" alt="Living Screen">
        </a>

        <!-- VOLTAR AO INÍCIO -->
        <a href="./index.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar ao início</span>
        </a>

    </header>


    <!-- LOGIN -->
    <main class="login-container">

        <!-- MOLDURA DO USUÁRIO -->
        <div class="user-frame">

            <img class="login-icon" src="./assets/img/IMIG-ICON-LOGIN.png" alt="Usuário">

        </div>


        <form class="login-form" novalidate>

            <!-- NOME DE USUÁRIO -->
            <div class="input-box">

                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
                </svg>

                <input type="text" id="login-usuario" class="login-input" placeholder="Nome de usuário" autocomplete="username">

            </div>


            <!-- SENHA -->
            <div class="input-box password-field">

                <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>

                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                </svg>

                <input type="password" id="login-senha" class="login-input" placeholder="Senha" autocomplete="current-password">

                <button type="button" class="password-toggle" aria-label="Mostrar senha" aria-pressed="false">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>

            </div>

            <div id="login-message" class="login-message" aria-live="polite" hidden></div>


            <!-- BOTÃO ENTRAR -->
            <button type="submit" class="login-button">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M10 17l5-5-5-5"></path>
                    <path d="M15 12H3"></path>
                    <path d="M21 3v18"></path>
                </svg>

                Entrar

            </button>

        </form>

        <!-- CADASTRO -->
        <p class="cadastro-login">
            Não tem uma conta?
            <a href="./cadastro.html">Cadastre-se</a>
        </p>

    </main>

    <div class="chatbot-widget" aria-live="polite">
        <div class="chatbot-panel" id="chatbot-panel" hidden>
            <div class="chatbot-header">
                <div class="chatbot-header-title">
                    <span class="chatbot-dot"></span>
                    Assistente Living Screen
                </div>

                <button class="chatbot-close" type="button" aria-label="Fechar chat">×</button>
            </div>

            <div class="chatbot-messages" id="chatbot-messages">
                <div class="message bot">
                    Olá! Como posso ajudar?
                </div>
            </div>

            <form class="chatbot-form" id="chatbot-form">
                <input id="chatbot-input" type="text" placeholder="Pergunte aqui..." aria-label="Digite sua mensagem">
                <button type="submit" aria-label="Enviar mensagem">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <button class="chatbot-toggle" type="button" aria-expanded="false" aria-controls="chatbot-panel"
            aria-label="Abrir assistente virtual">
            <span class="chatbot-toggle-icon"><i class="fa-solid fa-comment-dots"></i></span>
            <span class="chatbot-toggle-label">Chat</span>
        </button>
    </div>

    <!-- SWIPER JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="./assets/js/preLoader.js"></script>

    <script type="module" src="./assets/js/script.js"></script>
    <script src="./vlibra.js"></script>

</body>

</html>
