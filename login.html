<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAV ICON -->
    <link rel="icon" type="image/png" href="./assets/img/logo-png-sem-o-nome.png">

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./login.css">

    <title>Login | Living Screen</title>

    <!-- pre-loader -->
    <link rel="stylesheet" href="./assets/css/preLoader.css">

</head>

<body>

    <!-- =====================================================
     PRE-LOADER
====================================================== -->

    <div id="preloader">

        <div class="loader-bolhas">
            <div class="bubble-1"></div>
            <div class="bubble-2"></div>
        </div>

        <p>Carregando...</p>

    </div>

    <div id="liquid-effect">
        <canvas id="liquid-canvas"></canvas>
    </div>


    <!-- NAVBAR-->
    <header class="login-header">

        <!-- LOGO -->
        <a href="./index.html" class="login-logo">
            <img src="./assets/img/logo-png-sem-o-nome.png" alt="Living Screen">
        </a>

        <!-- VOLTAR AO INÍCIO -->
        <a href="./index.html" class="voltar">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar ao início</span>
        </a>

    </header>


    <!-- LOGIN -->
    <main class="login-container">

        <!-- MOLDURA DO USUÁRIO -->
        <div class="user-frame">

            <img class="login-icon" src="./assets/img/IMIG-ICON-LOGIN.png" alt="Usuário">

        </div>


        <!-- NOME DE USUÁRIO -->
        <div class="input-box">

            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
            </svg>

            <input type="text" class="login-input" placeholder="Nome de usuário">

        </div>


        <!-- SENHA -->
        <div class="input-box">

            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2"></rect>

                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>

            <input type="password" class="login-input" placeholder="Senha">

        </div>


        <!-- BOTÃO ENTRAR -->
        <button class="login-button">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M10 17l5-5-5-5"></path>
                <path d="M15 12H3"></path>
                <path d="M21 3v18"></path>
            </svg>

            Entrar

        </button>

        <!-- CADASTRO -->
        <p class="cadastro-login">
            Não tem uma conta?
            <a href="./cadastro.html">Cadastre-se</a>
        </p>

    </main>

    <!-- SWIPER JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="./assets/js/preLoader.js"></script>

    <script type="module" src="./assets/js/script.js"></script>

</body>

</html>
